name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo install mcp-publisher /usr/local/bin/mcp-publisher
      - name: Validate registry metadata
        run: mcp-publisher validate server.json
      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish registry metadata
        run: mcp-publisher publish server.json
