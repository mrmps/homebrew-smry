name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher_linux_amd64.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" \
            | sha256sum --check
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          sudo install mcp-publisher /usr/local/bin/mcp-publisher
      - name: Validate registry metadata
        run: mcp-publisher validate server.json
      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish registry metadata
        run: mcp-publisher publish server.json
